name: Jalankan AI Chaining YouTube Kids

on:
  workflow_dispatch: # Tombol Play manual di tab Actions
  schedule:
    - cron: '0 0 * * *' # Berjalan otomatis setiap hari (opsional)

jobs:
  run-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Tarik Kode dan Repository
        uses: actions/checkout@v3

      - name: Siapkan Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Kebutuhan Sistem (Dependencies)
        run: pip install -r requirements.txt

      - name: Jalankan Script AI
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: python ai_chain.py

      - name: Simpan Hasil Video & File sebagai Artifact
        uses: actions/upload-artifact@v3
        with:
          name: hasil-produksi-kartun
          path: |
            naskah_cerita.txt
            hasil_video_mentah.mp4
