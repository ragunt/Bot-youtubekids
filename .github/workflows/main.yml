name: Jalankan AI Chaining YouTube Kids

on:
  schedule:
    - cron: '0 8 * * *' # Berjalan otomatis setiap jam 8 pagi setiap hari
  workflow_dispatch: # Memungkinkan lo menekan tombol 'Run' manual kapan saja

jobs:
  run-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Tarik Kode dari Repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kebutuhan Sistem
        run: pip install -r requirements.txt

      - name: Jalankan Script AI
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python ai_chain.py
