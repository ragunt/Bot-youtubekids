name: Jalankan AI Chaining YouTube Kids

on:
  schedule:
    - cron: '0 8 * * *' # Jalankan setiap jam 08:00 UTC
  workflow_dispatch: # Tombol manual di tab Actions

jobs:
  run-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Tarik Kode dari Repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kebutuhan Sistem (Dependencies)
        run: |
          # Menginstal semua kebutuhan dari requirements.txt
          pip install -r requirements.txt
          # Menginstal moviepy secara spesifik (cara paksa jika cache bermasalah)
          pip install moviepy
          
      - name: Jalankan Script AI
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ai_chain.py
